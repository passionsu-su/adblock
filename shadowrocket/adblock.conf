# Shadowrocket 去广告规则合集
# 用法：复制下面的 RULE-SET / DOMAIN-SET 行，粘到你配置文件 [Rule] 段最前面（IP 类那行放到 FINAL 前）
#   RULE-SET  = DOMAIN/DOMAIN-SUFFIX/IP-CIDR 那种逐行规则
#   DOMAIN-SET = 纯域名集（.example.com 表示含子域）
# 默认只开推荐组合；其余已注释。规则太多会拖慢 iOS 网络扩展，一般 3～5 条足够

[Rule]
# ===== 推荐组合 =====
# Sukka 非 IP 类
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT
# Sukka 域名集
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT
# 217heidai 合并规则（国内友好）
DOMAIN-SET,https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksurge.list,REJECT
# blackmatrix7 Shadowrocket 广告
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list,REJECT

# ===== 可选 =====
# 217heidai Lite
# DOMAIN-SET,https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksurgelite.list,REJECT
# anti-AD 域名集 / 规则版（二选一）
# DOMAIN-SET,https://anti-ad.net/surge2.txt,REJECT
# RULE-SET,https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-surge.txt,REJECT
# blackmatrix7 广告 Lite / 隐私
# RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT
# RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Privacy/Privacy.list,REJECT
# Sukka extra 域名集（大）、drop/no-drop、搜狗输入法
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT
# RULE-SET,https://ruleset.skk.moe/List/non_ip/sogouinput.conf,REJECT
# Loyalsoldier
# DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/reject.txt,REJECT
# Cats-Team AdRules（规则版 / 域名集版二选一）
# RULE-SET,https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules.list,REJECT
# DOMAIN-SET,https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_surge_domainset.txt,REJECT
# 秋风广告规则 AWAvenue（很小）
# RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT
# ACL4SSR
# RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list,REJECT
# RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list,REJECT
# RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list,REJECT

# ……你原来的分流规则……

# IP 类放在 FINAL 前
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT

# 小火箭模块（在「配置 → 模块」里添加，不用粘到 [Rule]）
# GMOogway 拦截模块：https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_reject_list.module
# 毒奶网页去广告：https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Adblock4limbo.sgmodule

# 想直接用整份现成配置（会替换你的配置）：Johnshall 去广告版
# https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_ad_only.conf
