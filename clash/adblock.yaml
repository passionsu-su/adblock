# Clash Meta / mihomo 去广告规则合集
# 用法：把 rule-providers 段合并进你的配置，再把 rules 段的几行放到 rules: 最前面
# 默认只开推荐组合；其余已注释，需要时去掉 # 即可
# 注意：Clash 同时加载多个超大域名集会明显吃内存、拖慢匹配（尤其 sukka 基础 + extra 同开）
#       .mrs 为二进制格式，只有 mihomo 支持；原版 Clash / Clash Premium 请用 yaml/text 版本

rule-providers:
  # ===== 推荐组合 =====
  cn-ads:                       # 217heidai 合并规则（国内友好）
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.mrs
    path: ./ruleset/cn-ads.mrs
    interval: 86400

  reject_non_ip:                # Sukka 非 IP 类
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/Clash/non_ip/reject.txt
    path: ./sukkaw_ruleset/reject_non_ip.txt
    interval: 43200

  reject_domainset:             # Sukka 域名集
    type: http
    behavior: domain
    format: text
    url: https://ruleset.skk.moe/Clash/domainset/reject.txt
    path: ./sukkaw_ruleset/reject_domainset.txt
    interval: 43200

  reject_ip:                    # Sukka IP 类
    type: http
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/Clash/ip/reject.txt
    path: ./sukkaw_ruleset/reject_ip.txt
    interval: 43200

  app-ads:                      # blackmatrix7 Advertising（App 广告，带关键词）
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml
    path: ./ruleset/app-ads.yaml
    interval: 86400

  # ===== 可选（按需去掉注释）=====
