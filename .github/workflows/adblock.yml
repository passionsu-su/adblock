name: adblock
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  adblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: filter
        run: |
          cat > /tmp/adb.py <<'PYEOF'
          import re, json, sys, urllib.request, datetime
          BASE = sys.argv[1] if len(sys.argv) > 1 else "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/"
          KEEP = ["AdGuard_Base_filter", "AdGuard_Chinese_filter", "AdGuard_Mobile_Ads_filter", "AdGuard_DNS_filter",
                  "AdRules_DNS_List", "EasyList", "EasyList_China", "jiekouAD", "StevenBlack_hosts", "Pollock_hosts"]
          REMOVED = "OISD Basic, AWAvenue Ads Rule, EasyPrivacy, CJX's Annoyance List, xinggsf mv, DNS-Blocklists PRO mini"
          DOM = re.compile(r"^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_-]+)+$")
          def get(name):
              req = urllib.request.Request(BASE + name, headers={"User-Agent": "adblock-custom"})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return r.read().decode("utf-8", "ignore")
          ok = set()
          for n in KEEP:
              for l in get(n + ".txt").splitlines():
                  l = l.strip()
                  if not l or l[0] in "!#[" or l.startswith("@@"):
                      continue
                  m = re.match(r"^\|\|([^\^/$*|]+)\^(\$.*)?$", l)
                  if m:
                      d = m.group(1)
                  else:
                      p = l.split()
                      if len(p) >= 2 and p[0] in ("0.0.0.0", "127.0.0.1"):
                          d = p[1]
                      elif len(p) == 1 and DOM.match(l.lower()):
                          d = l
                      else:
                          continue
                  ok.add(d.lower().strip("."))
          src = get("adblockmosdns.txt")
          ver = re.search(r"# Version: (\S+)", src)
          out = [s for s in (x.strip() for x in src.splitlines()) if s and not s.startswith("#") and s in ok]
          if len(out) < 100000:
              raise SystemExit(f"too few domains: {len(out)}")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          hdr = (f"# Title: AdBlock MosDNS (custom)\n# Based on 217heidai/adblockfilters adblockmosdns.txt (Version {ver.group(1) if ver else '?'})\n"
                 f"# Removed sources: {REMOVED}\n# Last modified: {now}\n# Blocked domains: {len(out)}\n")
          body = hdr + "\n".join(out) + "\n"
          open("adblockmosdns-custom.txt", "w").write(body)
          json.dump({"updated": now, "domains": len(out), "bytes": len(body.encode())}, open("adblock-stats.json", "w"), indent=2)
          print(len(out), len(body.encode()))
          if len(out) >= 200000 or len(body.encode()) >= 10 * 1024 * 1024:
              print("WARNING: over limit", file=sys.stderr)
          PYEOF
          python3 /tmp/adb.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblockmosdns-custom.txt adblock-stats.json
          git diff --cached --quiet || git commit -m "adblock $(date -u +%F)"
          git pull --rebase && git push
